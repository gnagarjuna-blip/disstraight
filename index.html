<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roulette Predict - Deep LLM V7</title>
    <style>
        :root {
            --bg: #020617; --card: #1e293b; --glow: #8b5cf6; --cyan: #22d3ee;
            --red: #ef4444; --black: #0f172a; --green: #10b981;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 100px; }
        .view { display: none; padding: 20px; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Navigation */
        .nav { position: fixed; bottom: 0; width: 100%; background: #0f172a; display: flex; padding: 15px 0; border-top: 1px solid #334155; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; color: #94a3b8; font-size: 0.7rem; cursor: pointer; }
        .nav-item.active { color: var(--cyan); font-weight: bold; }

        /* Grid */
        .table-wrap { overflow-x: auto; background: #064e3b; padding: 15px; border-radius: 12px; border: 3px solid #78350f; }
        .grid { display: grid; grid-template-columns: 45px repeat(12, 40px); grid-template-rows: repeat(3, 40px); gap: 4px; }
        .cell { display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        
        /* Cards & Buttons */
        .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #334155; }
        .btn-ai { background: linear-gradient(45deg, var(--glow), var(--cyan)); color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        
        /* Results */
        #prediction-output { display: none; border-top: 4px solid var(--cyan); }
        .chip { width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; margin: 5px; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .log-entry { font-size: 0.8rem; color: var(--cyan); background: rgba(34, 211, 238, 0.1); padding: 8px; border-radius: 6px; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="v-home" class="view active">
        <div class="card" style="text-align: center;">
            <div style="font-size: 3rem;">🛰️</div>
            <h2>Neural Series Analyzer</h2>
            <p style="color: #94a3b8;">Deep Pattern Reconciliation Engine</p>
        </div>
        <div class="card">
            <small>Data Stream Health</small>
            <div id="data-bar" style="height: 8px; background: #334155; border-radius: 4px; margin-top: 5px;">
                <div id="data-fill" style="width: 0%; height: 100%; background: var(--cyan); border-radius: 4px; transition: 0.5s;"></div>
            </div>
            <p id="data-status" style="font-size: 0.7rem; margin-top: 8px;">Waiting for spin sequence...</p>
        </div>
    </div>

    <div id="v-input" class="view">
        <div class="table-wrap">
            <div class="grid" id="main-grid">
                <div class="cell" style="background:var(--green); grid-row: 1/span 3;" onclick="input(0)">0</div>
            </div>
        </div>
        <div class="card" style="margin-top: 20px;">
            <textarea id="bulk" rows="3" placeholder="Paste historical series (e.g., 3, 8, 11, 16)..."></textarea>
            <button class="btn-ai" style="margin-top:10px;" onclick="bulkLoad()">Load Series Data</button>
        </div>
    </div>

    <div id="v-predict" class="view">
        <div class="card">
            <button class="btn-ai" onclick="deepAnalyze()">Execute Deep AI Analysis</button>
        </div>

        <div id="prediction-output" class="card">
            <h3 style="margin-top:0; color:var(--cyan);">Calculated Series Target</h3>
            <div id="res-chips" style="text-align:center; padding: 10px 0;"></div>
            <div id="res-log" class="log-entry"></div>
        </div>
    </div>

    <div id="v-history" class="view">
        <h3>Series History</h3>
        <div id="hist-list"></div>
    </div>

    <nav class="nav">
        <div class="nav-item active" onclick="nav('home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="nav('input', this)">➕<br>Input</div>
        <div class="nav-item" onclick="nav('predict', this)">🧠<br>Analyze</div>
        <div class="nav-item" onclick="nav('history', this)">🕒<br>Log</div>
    </nav>

    <script>
        let history = [];
        const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        const wheel = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
        
        // Detailed FON (Faces of Numbers) Core
        const fonCore = {
            1:[6], 2:[7], 3:[8], 4:[9], 5:[0,10,15], 11:[16,24,29], 12:[17,21,26], 
            13:[18,31,36], 14:[19], 15:[10], 16:[11], 17:[12,21,26], 18:[13,31,36],
            19:[14], 20:[25], 21:[12,17,26], 22:[27], 23:[28,32], 24:[29], 25:[20],
            26:[12,21,17], 27:[22], 28:[23,32], 29:[24], 30:[35], 31:[18,33,36],
            32:[28,23], 33:[33], 34:[34], 35:[30], 36:[13,18,31]
        };

        function init() {
            const g = document.getElementById('main-grid');
            for(let i=1; i<=36; i++) {
                const c = document.createElement('div');
                c.className = 'cell';
                c.style.backgroundColor = reds.includes(i) ? 'var(--red)' : 'var(--black)';
                c.innerText = i;
                c.onclick = () => input(i);
                c.style.gridRow = 3 - (i-1)%3;
                c.style.gridColumn = Math.floor((i-1)/3) + 2;
                g.appendChild(c);
            }
        }

        function nav(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('v-'+id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function input(n) { history.push(n); updateUI(); }
        function bulkLoad() {
            const val = document.getElementById('bulk').value;
            const nums = val.split(/[\s,]+/).map(Number).filter(x => !isNaN(x));
            history = [...history, ...nums];
            document.getElementById('bulk').value = '';
            updateUI();
        }

        function updateUI() {
            const count = history.length;
            document.getElementById('data-fill').style.width = Math.min(count * 5, 100) + '%';
            document.getElementById('data-status').innerText = `Sequence Depth: ${count} spins. Deep analysis active.`;
            
            const list = document.getElementById('hist-list');
            list.innerHTML = history.slice(-10).reverse().map(n => `
                <div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #334155;">
                    <span>Reconciliation Point</span>
                    <b style="color:${n==0?'var(--green)':reds.includes(n)?'var(--red)':'white'}">${n}</b>
                </div>
            `).join('');
        }

        function deepAnalyze() {
            if(history.length < 1) return;
            const out = document.getElementById('prediction-output');
            const chips = document.getElementById('res-chips');
            const log = document.getElementById('res-log');
            out.style.display = 'block';
            chips.innerHTML = '';

            const last = history[history.length - 1];
            
            // 1. FON Analysis
            let primary = fonCore[last] || [];
            
            // 2. Series/Distance Analysis (Sequential Shift)
            let seriesShift = 0;
            if(history.length > 2) {
                const pos1 = wheel.indexOf(history[history.length-1]);
                const pos2 = wheel.indexOf(history[history.length-2]);
                seriesShift = (pos1 - pos2 + 37) % 37;
            }

            // 3. IndianCasinoGuy 'Mirror Cluster' Logic
            const mirrorTarget = wheel[(wheel.indexOf(last) + 18) % 37];
            
            // LLM Synthesis: Combine FON targets with Series Shift and Mirroring
            let finalTargets = [...primary];
            if(seriesShift !== 0) finalTargets.push(wheel[(wheel.indexOf(last) + seriesShift) % 37]);
            finalTargets.push(mirrorTarget);

            // Filter duplicates and zero bias
            let displayTargets = [...new Set(finalTargets)].slice(0, 5);
            if(displayTargets.length < 2) displayTargets = [0, 8, 11, 23];

            displayTargets.forEach(n => {
                const c = document.createElement('span');
                c.className = 'chip';
                c.style.backgroundColor = n==0?'var(--green)':reds.includes(n)?'var(--red)':'var(--black)';
                c.innerText = n;
                chips.appendChild(c);
            });

            log.innerText = `[AI LOG]: Analyzing FON for ${last} -> Found Cluster [${primary}]. Current Series Shift: ${seriesShift} pockets. Applied Mirroring to target ${mirrorTarget}. Sector Reconciliation successful.`;
        }

        init();
    </script>
</body>
</html>
